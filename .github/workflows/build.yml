name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Kiểm thử lõi âm thanh (nhịp chính xác, không trôi, voice, hàng đợi) trước khi dựng APK.
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run audio core tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Iapp/src/main/cpp \
            native-tests/core_test.cpp app/src/main/cpp/engine_core.cpp -o core_test
          ./core_test

  apk:
    needs: native-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BandStudio-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
