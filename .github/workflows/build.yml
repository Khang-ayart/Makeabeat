name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Phát hành bản này lên GitHub Releases (bản nhánh = bản thử nghiệm)"
        type: boolean
        default: false

# Cần để tạo GitHub Release chứa APK (app kiểm tra cập nhật ở đó).
permissions:
  contents: write

jobs:
  # Kiểm thử lõi âm thanh (nhịp chính xác, không trôi, voice, hàng đợi) trước khi dựng APK.
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run audio core tests
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Iapp/src/main/cpp \
            native-tests/core_test.cpp app/src/main/cpp/engine_core.cpp app/src/main/cpp/noise_reducer.cpp -o core_test
          ./core_test
          g++ -std=c++17 -O2 -Wall -Wextra -fsanitize=address,undefined -Iapp/src/main/cpp \
            native-tests/vocal_test.cpp app/src/main/cpp/vocal_dsp.cpp -o vocal_test
          ./vocal_test

  apk:
    needs: native-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Runner đã có sẵn Android SDK; chỉ cần đảm bảo có đúng NDK và CMake.
      - name: Install NDK and CMake
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;26.3.11579264" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Khóa ký lấy từ GitHub Secrets (MAKEABEAT_KEYSTORE_B64, MAKEABEAT_KEYSTORE_PASSWORD, MAKEABEAT_KEY_ALIAS, MAKEABEAT_KEY_PASSWORD).
      # Không có secrets thì ký debug (chỉ để thử, không phát hành).
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.MAKEABEAT_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MAKEABEAT_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "HAVE_KEY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Chưa có khóa ký (secrets). APK ký debug, sẽ không được phát hành và không cài đè lên bản chính thức."
            echo "HAVE_KEY=false" >> "$GITHUB_ENV"
          fi

      - name: Check signing key
        if: env.HAVE_KEY == 'true'
        env:
          SP: ${{ secrets.MAKEABEAT_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.MAKEABEAT_KEY_ALIAS }}
          KP: ${{ secrets.MAKEABEAT_KEY_PASSWORD }}
        run: |
          # Bỏ khoảng trắng / xuống dòng thừa khi dán secrets, rồi kiểm tra từng phần để báo lỗi rõ ràng (không in giá trị).
          SP=$(printf %s "$SP" | tr -d '[:space:]'); AL=$(printf %s "$AL" | tr -d '[:space:]'); KP=$(printf %s "$KP" | tr -d '[:space:]')
          echo "MAKEABEAT_KEYSTORE_PASSWORD=$SP" >> "$GITHUB_ENV"; echo "MAKEABEAT_KEY_ALIAS=$AL" >> "$GITHUB_ENV"; echo "MAKEABEAT_KEY_PASSWORD=$KP" >> "$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$SP" > "$RUNNER_TEMP/kt.txt" 2>&1; then
            echo "::error::Không mở được keystore: MAKEABEAT_KEYSTORE_B64 hỏng/thiếu, hoặc MAKEABEAT_KEYSTORE_PASSWORD sai (phải cùng bộ với tệp .jks)."; sed 's/[A-Za-z0-9+\/=]\{40,\}/<...>/g' "$RUNNER_TEMP/kt.txt" | head -5; exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$SP" -alias "$AL" > /dev/null 2>&1; then
            echo "::error::MAKEABEAT_KEY_ALIAS không khớp alias trong keystore (alias đúng là: makeabeat)."; exit 1
          fi
          echo "Khóa ký hợp lệ."

      - name: Unit tests + build release APK
        run: gradle testDebugUnitTest assembleRelease -PversionCode=${{ github.run_number }} -PversionName=0.2.${{ github.run_number }} --stacktrace

      - name: Name APK and show signing certificate
        id: apk
        run: |
          VER="0.2.${{ github.run_number }}"
          cp app/build/outputs/apk/release/*.apk "Makeabeat-v$VER.apk"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "Makeabeat-v$VER.apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "Makeabeat-v$VER.apk" | grep -i "SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Makeabeat-apk
          path: Makeabeat-v*.apk
          if-no-files-found: error

      # Bản main = bản chính thức; bản từ nhánh khác (chạy tay với publish=true) = bản thử nghiệm (prerelease).
      - name: Publish GitHub Release
        if: env.HAVE_KEY == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.publish == true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.apk.outputs.ver }}"
          PRE=""
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then PRE="--prerelease"; fi
          {
            echo "versionCode: ${{ github.run_number }}"
            echo "sha256: ${{ steps.apk.outputs.sha }}"
            echo "branch: ${{ github.ref_name }}"
            echo "commit: ${{ github.sha }}"
          } > notes.txt
          gh release create "v$VER" "Makeabeat-v$VER.apk" --title "Makeabeat $VER" --notes-file notes.txt --target "${{ github.sha }}" $PRE
